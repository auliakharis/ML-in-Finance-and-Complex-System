[project]
name = "ml-in-finance-and-complex-system"
version = "0.1.0"
description = "PDF/regulation tooling, compiler pipeline, and LoRA fine-tuning experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "datasets==4.8.4",
    "huggingface_hub==1.11.0",
    "jsonlines==4.0.0",
    "numpy==2.4.4",
    "pandas==2.2.3",
    "pdfplumber==0.11.4",
    "peft~=0.18.1",
    "pypdf==4.3.1",
    "reportlab==4.2.5",
    "safetensors==0.7.0",
    "scikit-learn==1.5.2",
    "tokenizers==0.22.2",
    "torch==2.10.0",
    "tqdm==4.67.1",
    "transformers",
    "trl",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_finance_workspace"]

[tool.hatch.build.targets.sdist]
include = ["ml_finance_workspace", "pyproject.toml", "README.md"]
